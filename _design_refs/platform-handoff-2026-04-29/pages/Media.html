<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media — Evolved Pros</title>
<link rel="stylesheet" href="colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Merriweather:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ed-bg:        #F5F0E8;
    --ed-surface:   #FFFFFF;
    --ed-border:    #E0D8CC;
    --ed-text:      #1B2A4A;
    --ed-text-muted:#6B7A8D;
    --ed-red:       #C9302A;
    --ed-gold:      #8B6A00;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;
    background:var(--ed-bg);
    color:var(--ed-text);
    font-family:'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  a{text-decoration:none;color:inherit}
  button{font-family:inherit}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(27,42,74,0.18);border-radius:0}
  ::-webkit-scrollbar-thumb:hover{background:rgba(27,42,74,0.32)}
  /* Print-friendly hairlines */
  @media (max-width: 980px){
    section > div[style*="grid-template-columns"]{
      grid-template-columns: 1fr !important;
    }
  }
</style>
</head>
<body data-theme="light">
<template id="__bundler_thumbnail">

  <text x="100" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic">

  </text>
  <rect x="20" y="98" width="160" height="2" fill="#1B2A4A"/>
  <rect x="20" y="106" width="160" height="2" fill="#1B2A4A"/>
</svg>
</template>
