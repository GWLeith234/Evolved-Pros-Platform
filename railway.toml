# Source of truth for the Railway `web` service. Dashboard start/build
# settings lose to this file. Do not switch the builder to Railpack here —
# production deploys are Nixpacks + this start command.

[build]
builder = "nixpacks"
nixpacksConfigPath = "nixpacks.toml"
installCommand = "pnpm install --no-frozen-lockfile"
buildCommand = "pnpm --filter web build && bash scripts/prepare-standalone.sh"

[deploy]
# Standalone server (not `next start`). Healthcheck stays /api/health.
startCommand = "bash scripts/start-standalone.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
# cronSchedule is intentionally unset on this web service. Railway does not
# fire GET /api/cron/*. The in-repo scheduler is .github/workflows/cron.yml
# (default branch Q2oUw): 08:00 expire/renew/events/digest, 17:00 member-nudges
# (#110 WIG + daily), Monday 08:15 goal-snapshots. podcast-sync / publish-posts
# / warmup remain admin or externally scheduled.
