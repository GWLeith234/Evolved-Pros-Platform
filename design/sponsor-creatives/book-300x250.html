<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 300px; height: 250px; overflow: hidden; }
  .ad { position: relative; width: 300px; height: 250px; display: flex; gap: 16px;
    background: linear-gradient(135deg, #24242a 0%, #17171b 60%, #0d0d10 100%);
    padding: 18px; font-family: "Barlow", sans-serif; }
  .cover { height: 190px; width: auto; border-radius: 3px; box-shadow: 0 8px 22px rgba(0,0,0,.55);
    flex-shrink: 0; }
  .copy { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .kicker { font-family: "Barlow", sans-serif; font-weight: 700; font-size: 9.5px;
    letter-spacing: .2em; text-transform: uppercase; color: #C89A3C; }
  .title { font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 19px; line-height: 1;
    letter-spacing: -0.3px; margin-top: 5px;
    background: linear-gradient(180deg,#E1BC5B,#C89A3C); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .launch { font-family: "Barlow", sans-serif; font-weight: 700; font-size: 18px; color: #F3EEE4;
    margin-top: 9px; line-height: 1.12; }
  .byline { font-family: "Barlow", sans-serif; font-weight: 500; font-size: 11px;
    letter-spacing: .04em; color: rgba(243,238,228,.55); margin-top: 4px; }
  .cta { margin-top: auto; text-align: center; font-family: "Barlow", sans-serif; font-weight: 700;
    font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: #17171b;
    background: linear-gradient(180deg,#E1BC5B,#C89A3C); padding: 9px 12px; border-radius: 6px;
    box-shadow: 0 6px 16px -6px rgba(200,154,60,.6); }
</style></head>
<body>
  <div class="ad">
    <img class="cover" src="book-cover.png" alt="EVOLVED by George Leith">
    <div class="copy">
      <div class="kicker">New Book</div>
      <div class="title">EVOLVED</div>
      <div class="launch">Launches<br>August&nbsp;15</div>
      <div class="byline">George Leith</div>
      <div class="cta">Pre-Order</div>
    </div>
  </div>
</body></html>
