<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 728px; height: 90px; overflow: hidden; }
  .ad {
    position: relative; width: 728px; height: 90px;
    background: radial-gradient(120% 200% at 8% 0%, #17324a 0%, #112535 40%, #0a141f 80%, #060c14 100%);
    display: flex; align-items: center; gap: 20px; padding: 0 24px 5px 26px;
    font-family: "Barlow", sans-serif;
  }
  .rule { position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #C9A84C 0%, #E7CE86 50%, #C9A84C 100%); }
  .logo { height: 30px; width: auto; flex-shrink: 0; opacity: .96; }
  .divider { width: 1px; height: 44px; background: rgba(245,240,232,.14); flex-shrink: 0; }
  .copy { flex: 1; min-width: 0; }
  .headline { font-family: "Playfair Display", serif; font-weight: 900; color: #F5F0E8;
    font-size: 25px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .headline .gold { color: #E7CE86; }
  .sub { font-family: "Barlow", sans-serif; font-weight: 500; color: rgba(245,240,232,.6);
    font-size: 12px; line-height: 1; margin-top: 6px; white-space: nowrap; }
  .cta { flex-shrink: 0; font-family: "Barlow Condensed", sans-serif; font-weight: 800;
    font-size: 13px; letter-spacing: .15em; color: #0a141f;
    background: linear-gradient(180deg,#E7CE86,#C9A84C); padding: 11px 22px; border-radius: 6px;
    text-transform: uppercase; box-shadow: 0 6px 18px -6px rgba(201,168,76,.6); }
  /* Six pillars as a full-width color spectrum along the bottom edge. */
  .spectrum { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; }
  .spectrum span { flex: 1; }
</style></head>
<body>
  <div class="ad">
    <div class="rule"></div>
    <img class="logo" src="assets/logo_dark.png" alt="Evolved Pros">
    <div class="divider"></div>
    <div class="copy">
      <div class="headline">Six Pillars. <span class="gold">No Ceiling.</span></div>
      <div class="sub">The framework that makes transformation inevitable.</div>
    </div>
    <div class="cta">Learn More</div>
    <div class="spectrum">
      <span style="background:#FFA538"></span>
      <span style="background:#A78BFA"></span>
      <span style="background:#F87171"></span>
      <span style="background:#60A5FA"></span>
      <span style="background:#C9A84C"></span>
      <span style="background:#0ABFA3"></span>
    </div>
  </div>
</body></html>
