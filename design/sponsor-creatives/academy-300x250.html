<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 300px; height: 250px; overflow: hidden; }
  .ad {
    position: relative; width: 300px; height: 250px;
    background: radial-gradient(120% 120% at 15% 0%, #17324a 0%, #112535 42%, #0a141f 78%, #060c14 100%);
    padding: 18px 18px 16px; display: flex; flex-direction: column;
    font-family: "Barlow", sans-serif;
  }
  .rule { position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #C9A84C 0%, #E7CE86 50%, #C9A84C 100%); }
  .logo { height: 19px; width: auto; opacity: .96; align-self: flex-start; }
  .headline { font-family: "Playfair Display", serif; font-weight: 900; color: #F5F0E8;
    font-size: 28px; line-height: 1.03; letter-spacing: -0.01em; margin-top: 13px; }
  .headline .gold { color: #E7CE86; }
  .sub { font-family: "Barlow", sans-serif; font-weight: 500; color: rgba(245,240,232,.62);
    font-size: 11.5px; line-height: 1.3; margin-top: 7px; max-width: 245px; }
  .bars { display: flex; align-items: flex-end; gap: 7px; height: 40px; margin-top: auto; }
  .bar { flex: 1; border-radius: 3px 3px 0 0; box-shadow: 0 0 14px -5px currentColor; }
  .cta { margin-top: 12px; text-align: center;
    font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 13px;
    letter-spacing: .16em; color: #0a141f; background: linear-gradient(180deg,#E7CE86,#C9A84C);
    padding: 10px 16px; border-radius: 6px; text-transform: uppercase;
    box-shadow: 0 6px 18px -6px rgba(201,168,76,.6); }
</style></head>
<body>
  <div class="ad">
    <div class="rule"></div>
    <img class="logo" src="assets/logo_dark.png" alt="Evolved Pros">
    <h1 class="headline">Six&nbsp;Pillars.<br><span class="gold">No&nbsp;Ceiling.</span></h1>
    <p class="sub">The framework that makes transformation inevitable.</p>
    <div class="bars">
      <span class="bar" style="height:32%; background:#FFA538; color:#FFA538"></span>
      <span class="bar" style="height:45%; background:#A78BFA; color:#A78BFA"></span>
      <span class="bar" style="height:58%; background:#F87171; color:#F87171"></span>
      <span class="bar" style="height:71%; background:#60A5FA; color:#60A5FA"></span>
      <span class="bar" style="height:85%; background:#C9A84C; color:#C9A84C"></span>
      <span class="bar" style="height:100%; background:#0ABFA3; color:#0ABFA3"></span>
    </div>
    <div class="cta">Learn More</div>
  </div>
</body></html>
