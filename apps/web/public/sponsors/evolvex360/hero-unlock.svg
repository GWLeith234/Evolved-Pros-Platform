<svg xmlns="http://www.w3.org/2000/svg" width="792" height="264" viewBox="0 0 792 264" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="ex-bg" x1="0" y1="0" x2="792" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F18"/>
      <stop offset="50%" stop-color="#12182A"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <radialGradient id="ex-glow" cx="72%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ex-keyhole-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#C9A4FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6A2BD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ex-lock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1F4A"/>
      <stop offset="50%" stop-color="#1A1435"/>
      <stop offset="100%" stop-color="#0E0C2A"/>
    </linearGradient>
    <filter id="ex-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="792" height="264" fill="url(#ex-bg)"/>
  <rect width="792" height="264" fill="url(#ex-glow)"/>
  <!-- ambient particles -->
  <circle cx="80" cy="48" r="1.5" fill="#A78BFA" opacity="0.5"/>
  <circle cx="140" cy="180" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="420" cy="40" r="2" fill="#60A5FA" opacity="0.35"/>
  <circle cx="500" cy="210" r="1.5" fill="#A78BFA" opacity="0.4"/>
  <!-- glowing lock body -->
  <g transform="translate(560 42)" filter="url(#ex-soft)">
    <!-- shackle -->
    <path d="M48 78 V48 C48 28 64 12 84 12 C104 12 120 28 120 48 V78"
      stroke="#A78BFA" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M48 78 V48 C48 28 64 12 84 12 C104 12 120 28 120 48 V78"
      stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
    <!-- body -->
    <rect x="28" y="72" width="112" height="100" rx="16" fill="url(#ex-lock)" stroke="#A78BFA" stroke-width="2"/>
    <rect x="28" y="72" width="112" height="100" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
    <!-- keyhole glow -->
    <circle cx="84" cy="118" r="22" fill="url(#ex-keyhole-glow)" opacity="0.85"/>
    <circle cx="84" cy="112" r="12" fill="#0A0F18"/>
    <rect x="78" y="118" width="12" height="28" rx="4" fill="#0A0F18"/>
    <!-- rim highlight -->
    <circle cx="84" cy="112" r="12" fill="none" stroke="#C9A4FF" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- outer ring pulse suggestion -->
  <circle cx="644" cy="132" r="88" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.2"/>
  <circle cx="644" cy="132" r="108" fill="none" stroke="#60A5FA" stroke-width="0.75" opacity="0.12"/>
</svg>
