  media-image-check:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '1,31 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'media-image-check'))
    steps:
      - name: Fail if a published story hero or og:image is broken
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' "$APP_URL/api/cron/media-image-check" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/media-image-check"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
