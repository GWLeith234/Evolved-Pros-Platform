          fi
          jq . body.json

  goal-snapshots:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 8 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'goal-snapshots'))
    steps:
      - name: Write weekly goal snapshots and WIG check-ins
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/goal-snapshots" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/goal-snapshots"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
