# Fail closed. Each cron step runs with `set -euo pipefail`, records the HTTP
# status, and exits 1 unless the response is 2xx (a 401 from a CRON_SECRET
# mismatch fails the job). The trimmed body is printed only on failure, and
# never the secret or the Authorization header. jq runs only after a 2xx, so a
# parse error fails the step. GitHub's default `bash -e` does not enable
# pipefail, which is why piping curl into jq used to stay green on a non-2xx response.
name: Daily Cron Jobs

on:
  schedule:
    # Expire / renew / events / digest — morning UTC
    - cron: '0 8 * * *'
    # #110 member nudges — after the 17:00 UTC evening cutoff (daily no-ops before then)
    - cron: '0 17 * * *'
    # Weekly WIG snapshots + check-in bells
    - cron: '15 8 * * 1'
    # Media hero check — every 30 minutes, one minute off :00 and :30
    - cron: '1,31 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (all, expire-tiers, renewal-reminders, event-reminders, daily-digest, member-nudges, goal-snapshots, thanks-nudges, media-image-check)'
        required: false
        default: 'all'

env:
  APP_URL: ${{ secrets.APP_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  expire-tiers:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'expire-tiers'))
    steps:
      - name: Expire lapsed memberships
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/expire-tiers" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/expire-tiers"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
              printf '%s\n' "$excerpt"
            fi
            exit 1
          fi
          jq . body.json

  renewal-reminders:
    runs-on: ubuntu-latest
    needs: expire-tiers
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'renewal-reminders'))
      )
    steps:
      - name: Tag contacts approaching expiry
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/renewal-reminders" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/renewal-reminders"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
              printf '%s\n' "$excerpt"
            fi
            exit 1
          fi
          jq . body.json

  event-reminders:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'event-reminders'))
    steps:
      - name: Send event reminders
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/event-reminders" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/event-reminders"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
              printf '%s\n' "$excerpt"
            fi
            exit 1
          fi
          jq . body.json

  daily-digest:
    runs-on: ubuntu-latest
