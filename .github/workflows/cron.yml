      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-digest'))
    steps:
      - name: Send daily digest emails
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/daily-digest" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/daily-digest"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
              printf '%s\n' "$excerpt"
            fi
            exit 1
          fi
          jq . body.json

  thanks-nudges:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'thanks-nudges'))
    steps:
      - name: Queue due thank-you Community nudges (never send)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/thanks-nudges" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/thanks-nudges"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
              printf '%s\n' "$excerpt"
            fi
            exit 1
          fi
          jq . body.json

  member-nudges:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 17 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'member-nudges'))
    steps:
      - name: Enqueue WIG and daily progress nudges
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          status="$(curl -sS -o body.json -w '%{http_code}' -X GET "$APP_URL/api/cron/member-nudges" \
            -H "Authorization: Bearer $CRON_SECRET")"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "HTTP ${status} from /api/cron/member-nudges"
            # Trimmed body only. Never print CRON_SECRET or the Authorization header.
            excerpt="$(head -c 500 body.json 2>/dev/null || true)"
            if [[ -n "${CRON_SECRET}" && "$excerpt" == *"$CRON_SECRET"* ]]; then
              echo "(response body omitted because it contains the cron secret)"
            else
