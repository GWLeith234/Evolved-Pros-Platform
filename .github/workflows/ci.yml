name: CI

on:
  push:
    branches: [main, develop, 'claude/init-evolved-pros-platform-**']
  pull_request:
    branches: [main, 'claude/init-evolved-pros-platform-**', 'cursor/et-viewer-entitlement-30d7']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # type-check: runs on main/develop AND the integration branch. Hard gate as of
      # 2026-07-01 — error count has been 0 since PR #17. If this ever fails,
      # it means new type debt was introduced; fix it, don't re-add continue-on-error.
      - name: Type check
        run: pnpm type-check

      # lint: blocking — this is the real quality gate
      - name: Lint
        run: pnpm lint

      # hex ratchet (STYLEGUIDE.md §4): raw hex in apps/web UI code may only
      # go down. Blocking — adding raw hex fails the build; converting hex to
      # tokens requires lowering .hex-baseline in the same commit.
      - name: Hex ratchet
        run: bash scripts/check-hex-ratchet.sh

      # Weekly report payloads must never land in git. Also runs the allowlist
      # gate tests (logged out, other admin, allowlisted).
      - name: Weekly report privacy
        run: |
          python3 scripts/check-weekly-report-payloads.py
          pnpm --filter web exec vitest run lib/reports/gate.test.ts

      # build: non-blocking — next/font/google may fail to fetch fonts on
      # GitHub runners. The production build on Railway always succeeds.
      - name: Build
        run: pnpm build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  et-viewer-entitlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
      - name: Pro gate tests
        run: bash supabase/tests/run_103_et_viewer_entitlement.sh

  et-member-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
      - name: Member prefs RLS tests
        run: bash supabase/tests/run_104_et_member_rls.sh

  et-brief-vip-and-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
      - name: EvPros Today brief opens to VIP and The 99
        run: bash supabase/tests/run_108_et_brief.sh
