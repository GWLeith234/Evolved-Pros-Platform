name: CI

on:
  push:
    branches: [main, develop, 'claude/init-evolved-pros-platform-**']
  pull_request:
    branches: [main, 'claude/init-evolved-pros-platform-**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # type-check: runs on main/develop AND the integration branch. Hard gate as of
      # 2026-07-01 — error count has been 0 since PR #17. If this ever fails,
      # it means new type debt was introduced; fix it, don't re-add continue-on-error.
      - name: Type check
        run: pnpm type-check

      # lint: blocking — this is the real quality gate
      - name: Lint
        run: pnpm lint

      # build: non-blocking — next/font/google may fail to fetch fonts on
      # GitHub runners. The production build on Railway always succeeds.
      - name: Build
        run: pnpm build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
